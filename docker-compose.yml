name: lifepath

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "39081:39081"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_PORT: 39081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifepath
      SPRING_DATASOURCE_USERNAME: lifepath
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lifepath}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:39173}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:39081/api/v1/calendar/callback}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:39081/api/v1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "39173:39173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:39173"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifepath
      POSTGRES_USER: lifepath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifepath}
    volumes:
      - lifepath_pgdata:/var/lib/postgresql/data
    # Port not exposed; backend connects via postgres:5432 on internal network.
    # Un-exposed to free 5432 for other services (e.g. Onyx).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifepath -d lifepath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lifepath_pgdata:
