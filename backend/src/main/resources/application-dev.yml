spring:
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.lifepath: DEBUG

# Google Calendar OAuth — set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET to enable.
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:39081/api/v1/calendar/callback}
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:39173}
